<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AI for Designers: workshop</title>
    <!-- /workshop opens the full-day deck, which lives at index.html#/workshop.
         A slide number after the path, as in /workshop#/12, is carried over. -->
    <meta http-equiv="refresh" content="0; url=../index.html#/workshop" />
    <script>
      var slide = (location.hash.match(/^#\/?(\d+)$/) || [])[1];
      location.replace("../index.html#/workshop" + (slide ? "/" + slide : ""));
    </script>
  </head>
  <body>
    <p><a href="../index.html#/workshop">Open the full-day workshop deck</a></p>
  </body>
</html>
